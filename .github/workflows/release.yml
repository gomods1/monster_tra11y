name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Regenerate release/readme.html from README.md
        run: pandoc -f gfm -t html -s --metadata title="Monster Train Accessibility Mod" README.md -o release/readme.html

      - name: Create zip
        run: cd release && zip -r ../MonsterTrainAccessibility-${{ github.ref_name }}.zip .

      - name: Carry installer forward from previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo ${{ github.repository }} --pattern 'MonsterTrainAccessibilityInstaller.exe' --dir .

      - name: Pick release notes
        id: notes
        run: |
          if [ -f "release-notes/${{ github.ref_name }}.md" ]; then
            echo "path=release-notes/${{ github.ref_name }}.md" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            MonsterTrainAccessibility-${{ github.ref_name }}.zip
            MonsterTrainAccessibilityInstaller.exe
          generate_release_notes: true
